---

- hosts: all
  become: true
  pre_tasks:

  - name: Update repo cache (Rocky)
    tags: always
    dnf:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Rocky"

  - name: Updates repo cache (Mint)
    tags: always
    apt:    
      update_cache: yes
    changed_when: false  
    when: ansible_distribution == "Linux Mint"

- hosts: all
  become: true
  tasks:
  
  - name: create Homer user
    tags: always
    user: 
      name: homer
      groups: root

  - name: add ssh key for homer 
    tags: always
    authorized_key:
      user: homer
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+w676A49Bz6RF1oYhvLj9Pw80B+XOd+5VYe2KBqQGF Ansible"


  - name: add sudoers file for homer
    tags: always
    copy: 
      src: sudoer_homer
      dest: /etc/sudoers.d/homer
      owner: root
      group: root
      mode: 0440        

- hosts: workstations
  tags: workstations
  become: true
  tasks:

  - name: install unzip
    package:
      name: unzip

  - name: install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/0.12.28/terraform_0.12.28_linux_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: 0755
      owner: root
      group: root

- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php for Rocky Linux servers
    tags: apache,httpd,rocky
    dnf:
      name:
        - httpd
        - php
      state: latest
    when: ansible_distribution == "Rocky"

  - name: start httpd (Rocky)
    tags: apache,rocky,httpd
    service:
      name: httpd
      state: started
      enabled: yes
    when: ansible_distribution == "Rocky" 

  - name: change e-mail address for admin
    tags: apache,rocky,httpd
    lineinfile: 
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin mikekaton21@gmail.com
    when: ansible_distribution == "Rocky"
    register: httpd

  - name: restart httpd (Rocky)
    tags: apache,rocky,httpd
    service:
      name: httpd
      state: restarted
    when: httpd.changed
 

  - name: install apache and php for Linux Mint servers
    tags: apache,apache2,mint 
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_distribution == "Linux Mint"

  - name: copy default html file for site
    tags: apache,apache2,httpd,index.html
    copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

- hosts: db_servers
  become: true
  tasks: 
  
  - name: install mariadb package (Rocky)
    tags: mariadb,db,rocky
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Rocky"

  - name: install mariadb package (Linux Mint)
    tags: mariadb,db,mint
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Linux Mint"
  
- hosts: file_servers
  become: true
  tasks: 

  - name: install samba package
    tags: samba 
    package:
      name: samba
      state: latest
