---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (Rocky)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "Rocky"

  - name: install updates (Mint)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Linux Mint"

- hosts: workstations
  tags: workstations
  become: true
  tasks:

  - name: install unzip
    package:
      name: unzip

  - name: install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/0.12.28/terraform_0.12.28_linux_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: 0755
      owner: root
      group: root

- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php for Rocky Linux servers
    tags: apache,httpd,rocky
    dnf:
      name:
        - httpd
        - php
      state: latest
    when: ansible_distribution == "Rocky"

  - name: install apache and php for Linux Mint servers
    tags: apache,apache2,mint 
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_distribution == "Linux Mint"

  - name: copy default html file for site
    tags: apache,apache2,httpd,index.html
    copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

- hosts: db_servers
  become: true
  tasks: 
  
  - name: install mariadb package (Rocky)
    tags: mariadb,db,rocky
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Rocky"

  - name: install mariadb package (Linux Mint)
    tags: mariadb,db,mint
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Linux Mint"
  
- hosts: file_servers
  become: true
  tasks: 

  - name: install samba package
    tags: samba 
    package:
      name: samba
      state: latest
