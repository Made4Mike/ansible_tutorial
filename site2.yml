---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (Rocky)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "Rocky"

  - name: install updates (Mint)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Linux Mint"

- hosts: web_servers
  become: true
  tasks:

  - name: install apache and php for Rocky Linux servers
    tags: apache,httpd,rocky
    dnf:
      name:
        - httpd
        - php
      state: latest
    when: ansible_distribution == "Rocky"

  - name: install apache and php for Linux Mint servers
    tags: apache,apache2,mint 
    apt:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_distribution == "Linux Mint"


- hosts: db_servers
  become: true
  tasks: 
  
  - name: install mariadb package (Rocky)
    tags: mariadb,db,rocky
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Rocky"

  - name: install mariadb package (Linux Mint)
    tags: mariadb,db,mint
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Linux Mint"
  
- hosts: file_servers
  become: true
  tasks: 

  - name: install samba package
    tags: samba 
    package:
      name: samba
      state: latest
